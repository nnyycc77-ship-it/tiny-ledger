name: USAspending fetcher tests

on:
  push:
  pull_request:

jobs:
  usaspending-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m unittest discover -s tools/tests -p 'test_usaspending_awards.py' -v
