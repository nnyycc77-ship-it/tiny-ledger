# MCPize deployment configuration for the Hojo recall check MCP server.
#
# Field names follow the coordinator's reading of MCPize's publish page on
# 2026-10-23 (https://mcpize.com/developers/publish-mcp-server), recorded on
# pull request #44: "mcpize.yaml as the deployment configuration (version,
# name, description, runtime, entry, build, startCommand with type http, sse,
# or stdio, and bridge mode for stdio servers)". The page itself was not
# reachable from the environment that wrote this file, so the nesting below
# is the plainest reading of that list and must be checked against the page
# before deployment (DEPLOYMENT.md, step 2). Every value comes from the merged
# core in mcp_server/; nothing here is a secret, and no pricing or payout
# field is set here on purpose: pricing and the payout wallet are configured
# in the MCPize dashboard at deployment (DEPLOYMENT.md, step 4).
version: "0.1.0"
name: hojo-recall-check
description: >-
  Sourced recall check from public United States recall records (CPSC
  SaferProducts and NHTSA) in a fixed evidence format: exact query, UTC
  retrieval time, source link, and the complete raw response beneath the
  link. One tool, recall_check. An empty result is proven by the raw
  response and is not a safety clearance; a failed fetch is an error.
# Python 3.12 is one of the two runtimes the publish page names (3.11 or 3.12)
# and satisfies the core's own requirement of 3.10 or later.
runtime: python3.12
# No build step: standard library only. The host must provide the curl
# executable, which the CPSC fetcher uses; see DEPLOYMENT.md.
entry: mcp_server/__main__.py
startCommand:
  type: stdio
  command: python3 -m mcp_server
  # The server speaks MCP over stdio; MCPize's bridge mode for stdio servers
  # exposes it over the network. Confirm the exact key for bridge mode on the
  # publish page before deployment.
  bridge: true
tools:
  - name: recall_check
    description: >-
      Recall check for a product (CPSC SaferProducts: product, optional
      exact_name and near) or a vehicle (NHTSA: make, model, year, optional
      exclude), returned as a Markdown report in the fixed evidence format.
