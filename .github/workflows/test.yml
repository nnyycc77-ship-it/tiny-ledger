name: test

on:
  push:
  pull_request:

jobs:
  delivery-tool-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check delivery tooling without network access
        run: python3 -m unittest discover -s tools/tests -v
      - name: Check the recall API without network access
        run: python3 -m unittest discover -s api -v

  forge-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Run the AgentTab test suite
        run: forge test -vvv

  proof-page-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run the proof page logic tests
        run: node --test app/proof-core.test.mjs
